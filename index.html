<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>서땡이네 주간 식단표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f9f9f9; color: #222; padding: 1.25rem 1rem; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.25rem; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 8px; }
  .week-nav { display: flex; align-items: center; gap: 8px; }
  .week-nav button { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
  .week-label { font-size: 13px; color: #888; min-width: 100px; text-align: center; }
  .mode-bar { display: flex; gap: 6px; }
  .mode-bar button { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .mode-bar button.active { background: #f0f0f0; font-weight: 500; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid #ddd; background: #f5f5f5; color: #888; }
  .badge.pub { background: #e6f4ea; color: #2e7d32; border-color: #c8e6c9; }
  .pub-btn { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .pub-btn.published { background: #e6f4ea; color: #2e7d32; border-color: #c8e6c9; }
  .saving { font-size: 11px; color: #aaa; }
  .notice { font-size: 13px; color: #aaa; margin-bottom: 1rem; }

  .days-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
  .day-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
  .day-header { font-size: 13px; font-weight: 500; color: #555; background: #f5f5f5; padding: 7px 12px; }
  .meal-row { display: flex; align-items: flex-start; border-top: 1px solid #f0f0f0; padding: 8px 12px; gap: 10px; }
  .meal-label { font-size: 12px; color: #aaa; min-width: 28px; padding-top: 3px; }
  .meal-input { flex: 1; border: none; background: transparent; font-size: 14px; font-family: sans-serif; outline: none; resize: none; color: #222; min-height: 22px; }
  .meal-text { flex: 1; font-size: 14px; color: #333; min-height: 22px; white-space: pre-wrap; }
  .meal-empty { color: #ccc; }

  .budget-section { margin-bottom: 1.25rem; }
  .budget-toggle { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; margin-bottom: 10px; width: 100%; text-align: left; }
  .budget-inner { display: none; }
  .budget-inner.open { display: block; }
  .budget-month-label { font-size: 12px; color: #aaa; margin-bottom: 8px; }
  .budget-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .budget-card { flex: 1; min-width: 90px; background: #f5f5f5; border-radius: 8px; padding: 10px 14px; }
  .budget-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .budget-val { font-size: 18px; font-weight: 500; }
  .budget-input { font-size: 16px; font-weight: 500; width: 100%; border: none; background: transparent; font-family: sans-serif; outline: none; }
  .remain-pos { color: #2e7d32; }
  .remain-neg { color: #c62828; }

  .section-title { font-size: 13px; font-weight: 500; color: #888; margin-bottom: 8px; }
  .comment-box { display: flex; gap: 8px; margin-bottom: 10px; }
  .comment-box input { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: sans-serif; }
  .comment-box button { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .comment-item { background: #f5f5f5; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .comment-text { font-size: 13px; flex: 1; }
  .comment-meta { font-size: 11px; color: #aaa; white-space: nowrap; }
  .del-btn { background: none; border: none; cursor: pointer; font-size: 11px; color: #bbb; }
  .empty { font-size: 13px; color: #bbb; padding: 8px 0; }
</style>
</head>
<body>

<h1>🍽 서땡이네 주간 식단표</h1>

<div class="top">
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <span class="week-label" id="week-label"></span>
    <button onclick="changeWeek(1)">›</button>
  </div>
  <div class="mode-bar">
    <button id="btn-editor" class="active" onclick="setMode('editor')">편집</button>
    <button id="btn-viewer" onclick="setMode('viewer')">보기</button>
  </div>
</div>

<div class="status-row">
  <span id="badge" class="badge">미게시</span>
  <button id="pub-btn" class="pub-btn" onclick="togglePublish()">게시하기</button>
  <span id="saving" class="saving" style="display:none">저장 중...</span>
</div>

<div id="unpublished-notice" class="notice" style="display:none">아직 게시된 식단이 없습니다.</div>

<div class="days-list" id="days-list"></div>

<div class="budget-section">
  <button class="budget-toggle" onclick="toggleBudget()">💰 예산 <span id="budget-arrow">▼</span></button>
  <div class="budget-inner" id="budget-inner">
    <div class="budget-month-label" id="budget-month-label"></div>
    <div class="budget-row">
      <div class="budget-card">
        <div class="budget-label">총 예산</div>
        <div id="budget-total-wrap"></div>
      </div>
      <div class="budget-card">
        <div class="budget-label">사용 금액</div>
        <div id="budget-spent-wrap"></div>
      </div>
      <div class="budget-card">
        <div class="budget-label">남은 예산</div>
        <div class="budget-val" id="budget-remain">-</div>
      </div>
    </div>
  </div>
</div>

<div>
  <div class="section-title">의견</div>
  <div class="comment-box">
    <input id="comment-input" placeholder="의견을 입력하세요 (받아들일지는 서영이 마음♥)" onkeydown="if(event.key==='Enter')addComment()"/>
    <button onclick="addComment()">등록</button>
  </div>
  <div id="comments-list"></div>
</div>

<script>
// ★ 여기만 바꾸세요 ★
const SUPABASE_URL = 'https://mnpvkrdkfxguzsejitkn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_abc_Zh5h2CfBYUtu1RWnnw_i_WyyKrK';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS = ['월','화','수','목','금','토','일'];
const MEALS = ['점심','저녁'];

let weekOffset = 0;
let mode = 'editor';
let weekData = null;
let monthBudget = { total: '', spent: '' };
let budgetOpen = false;

function getWeekKey(offset=0) {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1 + offset * 7);
  return mon.toISOString().slice(0,10);
}

function getWeekLabel(offset=0) {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1 + offset * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(mon)} ~ ${f(sun)}`;
}

function getMonthKey(offset=0) {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1 + offset * 7);
  return `month-${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}`;
}

function getMonthLabel(offset=0) {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1 + offset * 7);
  return `${mon.getFullYear()}년 ${mon.getMonth()+1}월`;
}

function defaultWeek() {
  const meals = {};
  DAYS.forEach(d => { meals[d] = {}; MEALS.forEach(m => meals[d][m] = ''); });
  return { meals, published: false, comments: [] };
}

async function loadWeek() {
  const wkey = getWeekKey(weekOffset);
  const mkey = getMonthKey(weekOffset);
  const [wr, mr] = await Promise.all([
    db.from('meal_plans').select('data').eq('week_key', wkey).single(),
    db.from('meal_plans').select('data').eq('week_key', mkey).single()
  ]);
  weekData = wr.data ? wr.data.data : defaultWeek();
  monthBudget = mr.data ? mr.data.data : { total: '', spent: '' };
  render();
}

async function saveWeek() {
  showSaving();
  await db.from('meal_plans').upsert({ week_key: getWeekKey(weekOffset), data: weekData });
  hideSaving();
}

async function saveMonthBudget() {
  showSaving();
  await db.from('meal_plans').upsert({ week_key: getMonthKey(weekOffset), data: monthBudget });
  hideSaving();
}

function showSaving() { document.getElementById('saving').style.display = 'inline'; }
function hideSaving() { setTimeout(() => document.getElementById('saving').style.display = 'none', 600); }

function render() {
  document.getElementById('week-label').textContent = getWeekLabel(weekOffset);
  document.getElementById('budget-month-label').textContent = getMonthLabel(weekOffset);

  const pub = weekData.published;
  document.getElementById('badge').textContent = pub ? '게시됨' : '미게시';
  document.getElementById('badge').className = pub ? 'badge pub' : 'badge';
  const pbtn = document.getElementById('pub-btn');
  pbtn.textContent = pub ? '게시 취소' : '게시하기';
  pbtn.className = pub ? 'pub-btn published' : 'pub-btn';
  pbtn.style.display = mode === 'editor' ? 'inline-block' : 'none';
  document.getElementById('unpublished-notice').style.display = (!pub && mode === 'viewer') ? 'block' : 'none';

  // 요일 카드
  const list = document.getElementById('days-list');
  list.innerHTML = '';
  DAYS.forEach(day => {
    const card = document.createElement('div');
    card.className = 'day-card';
    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = day + '요일';
    card.appendChild(header);
    MEALS.forEach(meal => {
      const row = document.createElement('div');
      row.className = 'meal-row';
      const label = document.createElement('span');
      label.className = 'meal-label';
      label.textContent = meal;
      row.appendChild(label);
      const val = (weekData.meals[day] && weekData.meals[day][meal]) || '';
      if (mode === 'editor') {
        const ta = document.createElement('textarea');
        ta.className = 'meal-input';
        ta.rows = 1;
        ta.value = val;
        ta.placeholder = '입력';
        ta.oninput = (e => {
          const d = day, m = meal;
          return function() {
            if (!weekData.meals[d]) weekData.meals[d] = {};
            weekData.meals[d][m] = this.value;
            saveWeek();
          };
        })();
        row.appendChild(ta);
      } else {
        const span = document.createElement('span');
        span.className = val ? 'meal-text' : 'meal-text meal-empty';
        span.textContent = val || '-';
        row.appendChild(span);
      }
      card.appendChild(row);
    });
    list.appendChild(card);
  });

  // 예산
  renderBudgetField('budget-total-wrap', 'total');
  renderBudgetField('budget-spent-wrap', 'spent');
  updateRemain();

  // 댓글
  const cl = document.getElementById('comments-list');
  cl.innerHTML = '';
  const comments = weekData.comments || [];
  if (!comments.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '아직 의견이 없습니다.';
    cl.appendChild(p);
  } else {
    comments.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'comment-item';
      const txt = document.createElement('span');
      txt.className = 'comment-text';
      txt.textContent = c.text;
      const meta = document.createElement('span');
      meta.className = 'comment-meta';
      meta.textContent = c.time;
      const btn = document.createElement('button');
      btn.className = 'del-btn';
      btn.textContent = '삭제';
      btn.onclick = () => deleteComment(i);
      div.appendChild(txt); div.appendChild(meta); div.appendChild(btn);
      cl.appendChild(div);
    });
  }
}

function renderBudgetField(id, field) {
  const wrap = document.getElementById(id);
  const val = monthBudget[field] || '';
  if (mode === 'editor') {
    const input = document.createElement('input');
    input.className = 'budget-input';
    input.type = 'number';
    input.value = val;
    input.placeholder = '0';
    input.oninput = function() {
      monthBudget[field] = this.value;
      saveMonthBudget();
      updateRemain();
    };
    wrap.innerHTML = '';
    wrap.appendChild(input);
  } else {
    wrap.innerHTML = `<div class="budget-val">${val ? Number(val).toLocaleString()+'원' : '-'}</div>`;
  }
}

function updateRemain() {
  const t = parseFloat(monthBudget.total) || 0;
  const s = parseFloat(monthBudget.spent) || 0;
  const r = t - s;
  const el = document.getElementById('budget-remain');
  el.textContent = monthBudget.total ? r.toLocaleString()+'원' : '-';
  el.className = 'budget-val ' + (r >= 0 ? 'remain-pos' : 'remain-neg');
}

function toggleBudget() {
  budgetOpen = !budgetOpen;
  document.getElementById('budget-inner').className = budgetOpen ? 'budget-inner open' : 'budget-inner';
  document.getElementById('budget-arrow').textContent = budgetOpen ? '▲' : '▼';
}

function changeWeek(dir) { weekOffset += dir; loadWeek(); }

function setMode(m) {
  mode = m;
  document.getElementById('btn-editor').className = m === 'editor' ? 'active' : '';
  document.getElementById('btn-viewer').className = m === 'viewer' ? 'active' : '';
  render();
}

async function togglePublish() {
  weekData.published = !weekData.published;
  await saveWeek();
  render();
}

async function addComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text) return;
  const time = new Date().toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  if (!weekData.comments) weekData.comments = [];
  weekData.comments.push({ text, time });
  input.value = '';
  await saveWeek();
  render();
}

async function deleteComment(i) {
  weekData.comments.splice(i, 1);
  await saveWeek();
  render();
}

loadWeek();
</script>
</body>
</html>
